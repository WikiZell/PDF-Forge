name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "Test (Linux, core, frontend, E2E)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Frontend E2E (mocked IPC)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - run: cargo fmt --all --check
      - name: Licence inventory is current and has no disallowed licences
        run: npm run licenses:check
      - run: node scripts/fetch-pdfium.mjs linux-x64
      - name: Rust tests with real PDFium (core + render)
        run: cargo test -p pdf-core -p pdf-render --locked -- --test-threads=1
        env:
          PDFIUM_DIR: ${{ github.workspace }}/src-tauri/resources/pdfium
          PDFIUM_REQUIRED: "1"
          FUZZ_ITERS: "5000"
      - name: Performance smoke (1,000 pages)
        run: cargo test --release -p pdf-core --test perf --locked -- --nocapture
        env:
          PDFIUM_DIR: ${{ github.workspace }}/src-tauri/resources/pdfium
      - name: Tauri crate compiles and its unit tests pass
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          npm run build
          cargo clippy -p pdf-core -p pdf-render -p pdf-forge --locked -- -D warnings
          cargo test -p pdf-forge --locked
        env:
          PDFIUM_DIR: ${{ github.workspace }}/src-tauri/resources/pdfium
          PDFIUM_REQUIRED: "1"

  fuzz:
    name: Fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          cd fuzz
          mkdir -p corpus/load_build && cp ../tests/fixtures/*.pdf corpus/load_build/
          cargo fuzz run load_build -- -max_total_time=120 -rss_limit_mb=2048
          cargo fuzz run split_ranges -- -max_total_time=30

  windows:
    name: Build Windows installers (unsigned)
    runs-on: windows-latest
    permissions:
      contents: write   # only to publish the installers to the `windows-builds` branch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/fetch-pdfium.mjs win-x64
      - name: Rust tests with real PDFium (Windows)
        run: cargo test -p pdf-core -p pdf-render --locked -- --test-threads=1
        env:
          PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\pdfium
          PDFIUM_REQUIRED: "1"
      - name: Build MSI + NSIS
        run: npx tauri build
        env:
          # Authenticode hook: once a certificate exists, add repo secrets and set
          # bundle.windows.certificateThumbprint / signCommand in tauri.conf.json (see docs/RELEASING.md).
          SIGN_WINDOWS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish installers to the windows-builds branch (so they can be fetched with git)
        if: github.ref_type == 'branch' && github.event_name == 'push'
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\wb"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item target\release\bundle\msi\*.msi, target\release\bundle\nsis\*.exe $dest
          "built from $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File "$dest\BUILD-INFO.txt" -Encoding utf8
          Set-Location $dest
          git init -q -b windows-builds
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows installers from $env:GITHUB_SHA"
          git push -f "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" windows-builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-smoke:
    name: Windows smoke (install, launch on WebView2, Chrome render)
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write   # only to publish screenshots to the `windows-smoke` branch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Generate sample PDFs (merged, signed annotate/flatten)
        shell: pwsh
        run: |
          $env:SAMPLES_DIR = "$PWD\samples"
          $env:SCAN_PAGES = "1000"
          # release build: JPEG-encoding 1,000 page images is too slow unoptimised
          cargo test --release -p pdf-core --test sample_outputs --locked
          Get-ChildItem samples -Recurse | Select-Object FullName, Length
      - name: Silent per-user install (no admin)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse installers | Select-Object FullName, Length
          $exe = Get-ChildItem -Recurse installers -Filter *-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S" -PassThru -Wait
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $app = Get-ChildItem -Path "$env:LOCALAPPDATA" -Recurse -Filter pdf-forge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { Write-Error "installed pdf-forge.exe not found under LOCALAPPDATA"; exit 1 }
          "installed at $($app.FullName)"
          "APP_EXE=$($app.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem (Split-Path $app.FullName) | Select-Object Name, Length
          if (-not (Test-Path (Join-Path (Split-Path $app.FullName) "resources\pdfium\pdfium.dll")) -and -not (Test-Path (Join-Path (Split-Path $app.FullName) "pdfium.dll"))) { Write-Warning "pdfium.dll not found next to the exe (checking recursively)"; Get-ChildItem (Split-Path $app.FullName) -Recurse -Filter pdfium.dll }
      - name: Launch installed app on a PDF under WebView2 and screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          foreach ($f in "merged", "signed-annot", "signed-flat") {
            $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList "`"$PWD\samples\$f.pdf`"" -PassThru
            Start-Sleep -Seconds 14
            $proc.Refresh()
            "$f : exited=$($proc.HasExited) title='$($proc.MainWindowTitle)'"
            Shot $f
            if ($proc.HasExited) { Write-Error "app exited early for $f (exit code $($proc.ExitCode))"; exit 1 }
            Stop-Process -Id $proc.Id -Force
            Start-Sleep -Seconds 2
          }
      - name: Render the same PDFs in Chrome (independent viewer)
        shell: pwsh
        continue-on-error: true
        run: |
          $chrome = (Get-Command chrome -ErrorAction SilentlyContinue).Source
          if (-not $chrome) { $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe" }
          foreach ($f in "merged", "signed-annot", "signed-flat") {
            $url = "file:///" + ("$PWD\samples\$f.pdf" -replace '\\', '/')
            Start-Process -FilePath $chrome -ArgumentList "--headless=new","--disable-gpu","--hide-scrollbars","--window-size=900,1100","--virtual-time-budget=8000","--screenshot=$PWD\shots\chrome-$f.png",$url -Wait
            Start-Sleep -Seconds 2
          }
          Get-ChildItem shots | Select-Object Name, Length
      - name: Enable WebView2 remote debugging for pdf-forge.exe (CI runner only; product is unchanged)
        shell: pwsh
        run: |
          # The WebView2 policy registry value overrides the app's own browser arguments (env var does not).
          foreach ($root in "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments", "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments") {
            New-Item -Path $root -Force | Out-Null
            New-ItemProperty -Path $root -Name "*" -Value "--remote-debugging-port=9444 --remote-allow-origins=*" -PropertyType String -Force | Out-Null
            New-ItemProperty -Path $root -Name "pdf-forge.exe" -Value "--remote-debugging-port=9444 --remote-allow-origins=*" -PropertyType String -Force | Out-Null
          }
          Get-ItemProperty "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" | Format-List
      - name: Diagnose WebView2 remote-debugging port (for the real-app E2E)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath $env:APP_EXE -ArgumentList "`"$PWD\samples\merged.pdf`"" -PassThru
          Start-Sleep -Seconds 20
          "app alive: $(-not $p.HasExited)"
          "--- webview2 processes"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 3 -ExpandProperty CommandLine
          "--- listening ports"
          netstat -ano | Select-String "LISTENING" | Select-String "9444|9333|127.0.0.1"
          "--- /json/version"
          try { (Invoke-WebRequest http://127.0.0.1:9444/json/version -UseBasicParsing -TimeoutSec 5).Content } catch { "ERR: $_" }
          Stop-Process -Id $p.Id -Force
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Drive the REAL installed app over WebView2 (CDP) - interactive E2E with the real backend
        shell: pwsh
        run: |
          npx playwright test -c playwright.real.config.ts
        env:
          SAMPLES_DIR: ${{ github.workspace }}\samples
          SHOTS_DIR: ${{ github.workspace }}\shots
      - name: Open the files the app saved in Microsoft Edge's PDF viewer (independent of our rendering)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          New-Item -ItemType Directory -Force "$PWD\shots\app-output" | Out-Null
          # A control PDF produced by Edge itself: if even this does not render in the screenshot, the
          # problem is the environment/timing, not our files.
          $control = "$PWD\shots\app-output\control-by-edge.pdf"
          Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--no-pdf-header-footer","--user-data-dir=$env:RUNNER_TEMP\edge-ctl","--print-to-pdf=$control","data:text/html,<h1>Control PDF made by Edge</h1><p>If you can read this, Edge renders PDFs here.</p>" -Wait
          "control exists: $(Test-Path $control) size: $((Get-Item $control -ErrorAction SilentlyContinue).Length)"
          $files = @("control-by-edge", "app-signed-annot", "app-signed-flat", "app-organized")
          foreach ($f in $files) {
            $path = "$PWD\shots\app-output\$f.pdf"
            if (-not (Test-Path $path)) { "missing $path"; continue }
            $p = Start-Process -FilePath $edge -ArgumentList "--new-window","--user-data-dir=$env:RUNNER_TEMP\edge-$f","--no-first-run","--start-maximized","file:///$($path -replace '\\','/')" -PassThru
            Start-Sleep -Seconds 25
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\edge-$f.png"); $g.Dispose(); $bmp.Dispose()
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }
      - name: Try Adobe Acrobat Reader (install via Chocolatey, open the app's saved files)
        if: always()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          choco install adobereader -y --no-progress --params '"/UpdateMode:0"' 2>&1 | Select-Object -Last 15
          $reader = Get-ChildItem "C:\Program Files*\Adobe\Acrobat Reader*\Reader\AcroRd32.exe", "C:\Program Files*\Adobe\Acrobat DC\Acrobat\Acrobat.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $reader) { "Acrobat Reader executable not found"; exit 0 }
          "Acrobat Reader at $($reader.FullName)"
          # accept the first-run licence / disable prompts so the document window is reachable
          foreach ($k in "HKCU:\Software\Adobe\Acrobat Reader\DC\AdobeViewer", "HKLM:\SOFTWARE\Adobe\Acrobat Reader\DC\AdobeViewer") {
            New-Item -Path $k -Force -ErrorAction SilentlyContinue | Out-Null
            New-ItemProperty -Path $k -Name EULA -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($f in "app-signed-annot", "app-signed-flat", "app-organized") {
            $path = "$PWD\shots\app-output\$f.pdf"
            if (-not (Test-Path $path)) { "missing $path"; continue }
            $p = Start-Process -FilePath $reader.FullName -ArgumentList "`"$path`"" -PassThru
            Start-Sleep -Seconds 30
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\acrobat-$f.png"); $g.Dispose(); $bmp.Dispose()
            Get-Process AcroRd32, Acrobat, AcroCEF -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-screenshots
          path: |
            shots/*.png
            samples/*.pdf
          if-no-files-found: warn
      - name: Publish screenshots to the windows-smoke branch (so they can be viewed)
        if: always() && github.ref_type == 'branch' && github.event_name == 'push'
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\ws"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item shots\*.png, shots\*.txt, shots\*.json $dest -ErrorAction SilentlyContinue
          Copy-Item shots\app-output\*.pdf $dest -ErrorAction SilentlyContinue
          Copy-Item samples\*.pdf $dest -ErrorAction SilentlyContinue
          "from $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File "$dest\INFO.txt" -Encoding utf8
          Set-Location $dest
          git init -q -b windows-smoke
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows smoke screenshots from $env:GITHUB_SHA"
          git push -f "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" windows-smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-msi:
    name: Windows MSI (install, launch, uninstall)
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write   # only to publish a screenshot to the `windows-msi` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Silent MSI install
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Recurse installers -Filter *.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart","/L*v","$PWD\msi-install.log" -Wait -PassThru
          "msiexec install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; exit 1 }
          $exe = Get-ChildItem "C:\Program Files\PDF Forge\pdf-forge.exe", "$env:LOCALAPPDATA\Programs\PDF Forge\pdf-forge.exe", "C:\Program Files (x86)\PDF Forge\pdf-forge.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem "C:\Program Files" -Recurse -Filter pdf-forge.exe -ErrorAction SilentlyContinue | Select-Object FullName; Write-Error "installed exe not found"; exit 1 }
          "installed at $($exe.FullName)"
          "MSI_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem (Split-Path $exe.FullName) -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - name: Launch the MSI-installed app on a PDF and screenshot it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $pdf = "$PWD\tests\fixtures\text-3page-outline.pdf"
          $p = Start-Process -FilePath $env:MSI_EXE -ArgumentList "`"$pdf`"" -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          "exited=$($p.HasExited) title='$($p.MainWindowTitle)'"
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\shots\msi-installed-app.png"); $g.Dispose(); $bmp.Dispose()
          if ($p.HasExited) { Write-Error "MSI-installed app exited early (code $($p.ExitCode))"; exit 1 }
          if ($p.MainWindowTitle -notlike "PDF Forge*") { Write-Error "unexpected window title"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Uninstall the MSI and verify it is gone
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Recurse installers -Filter *.msi | Select-Object -First 1).FullName
          Start-Sleep -Seconds 3
          $p = Start-Process msiexec.exe -ArgumentList "/x","`"$msi`"","/qn","/norestart" -Wait -PassThru
          "msiexec uninstall exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Test-Path $env:MSI_EXE) { Write-Error "app still present after uninstall"; exit 1 }
          "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msi-evidence
          path: |
            shots/*.png
            msi-install.log
          if-no-files-found: warn
      - name: Publish the screenshot to the windows-msi branch
        if: always() && github.ref_type == 'branch' && github.event_name == 'push'
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\wm"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item shots\*.png $dest -ErrorAction SilentlyContinue
          "from $env:GITHUB_SHA on $(Get-Date -Format u)" | Out-File "$dest\INFO.txt" -Encoding utf8
          Set-Location $dest
          git init -q -b windows-msi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "MSI smoke screenshot from $env:GITHUB_SHA"
          git push -f "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" windows-msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
